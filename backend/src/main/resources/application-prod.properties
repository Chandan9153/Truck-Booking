# Production profile (Render): real MySQL on TiDB Cloud.
# Database connection comes ONLY from environment variables set on Render
# (DB_URL, DB_USERNAME, DB_PASSWORD) — no password is written in this file.
# Tables are created/updated from the entities; nothing is dropped.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
